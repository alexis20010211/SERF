<div class="dashboard-admin-container">
  <h2>Panel de Administración - Ventas</h2>

  <!-- Mensaje si no hay ventas -->
  <p *ngIf="ventas.length === 0">No hay ventas registradas.</p>

  <!-- Tabla de ventas -->
  <table *ngIf="ventas.length > 0" class="ventas-table">
    <thead>
      <tr>
        <th>ID Venta</th>
        <th>ID Cliente</th>
        <th>ID Producto</th>
        <th>Cantidad</th>
        <th>Total</th>
        <th>Fecha</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let venta of ventas">
        <td>{{ venta.id }}</td>
        <td>{{ venta.clienteId }}</td>
        <td>{{ venta.productoId }}</td>
        <td>{{ venta.cantidad }}</td>
        <td>{{ venta.total | currency:'USD':'symbol' }}</td>
        <td>{{ venta.fecha | date:'short' }}</td>
      </tr>
    </tbody>
  </table>
</div>
